<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loaded Map Texture Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; color: #ccc; font-family: monospace; font-size: 13px; }
    canvas { display: block; }
    .panel { position: absolute; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 4px; }
    #info { top: 10px; left: 10px; max-width: 420px; }
    #controls { top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    #report { bottom: 10px; left: 10px; max-height: 45vh; overflow-y: auto; max-width: 560px; }
    #errors { top: 120px; left: 10px; color: #f66; display: none; max-width: 420px; white-space: pre-wrap; }
    button, select { font-family: monospace; background: #222; color: #ccc; border: 1px solid #555; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    button.active { color: #7af; border-color: #7af; }
    table { border-collapse: collapse; }
    td, th { padding: 1px 8px 1px 0; text-align: left; }
    tr.fallback td { color: #ff6b6b; }
  </style>
</head>
<body>
  <div id="info" class="panel">Loading...</div>
  <div id="errors" class="panel"></div>
  <div id="controls" class="panel">
    <label>Textures <select id="texset"></select></label>
    <div id="cuts"></div>
    <button id="hilite">Highlight fallbacks</button>
    <label>Load fixture <input type="file" id="picker" accept=".json"></label>
  </div>
  <div id="report" class="panel"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const $ = (id) => document.getElementById(id);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.8);
    sun.position.set(30, 60, 20);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(40, 40, 40);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);

    // Tier cut-away: keeps everything at or below cutY (a clip plane, not a per-mesh hide).
    const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

    let model = null, report = null, highlight = false, fallbackMat = null;
    let textureSet = new URLSearchParams(location.search).get('textures'); // null = use the server's default pack

    function setCut(cutY) {
      renderer.clippingPlanes = cutY === null ? [] : [cutPlane];
      if (cutY !== null) cutPlane.constant = cutY;
      for (const b of $('cuts').children) {
        b.classList.toggle('active', cutY === null ? b.dataset.cut === '' : Number(b.dataset.cut) === cutY && b.dataset.cut !== '');
      }
    }

    function buildCuts(meta) {
      const box = $('cuts');
      box.replaceChildren();
      const add = (label, cutY) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.dataset.cut = cutY === null ? '' : String(cutY);
        b.addEventListener('click', () => setCut(cutY));
        box.appendChild(b);
      };
      const tiers = meta.tiers ?? 1;
      for (let k = 0; k < tiers; k++) add(k === 0 ? 'Ground' : `Tier ${k}`, (k + 1) * meta.levelHeight - meta.floorThickness);
      add('All', null);
      setCut(null);
    }

    function applyHighlight() {
      if (!model || !report) return;
      fallbackMat ??= new THREE.MeshBasicMaterial({ color: report.highlightColor });
      const bad = new Set();
      for (const r of report.rows) {
        if (r.status === 'ok') continue;
        for (const n of r.names) { bad.add(n); bad.add(n + '_box'); }
      }
      model.traverse((m) => {
        if (!m.isMesh) return;
        m.userData.orig ??= m.material;
        m.material = highlight && bad.has(m.name) ? fallbackMat : m.userData.orig;
      });
      $('hilite').classList.toggle('active', highlight);
    }

    function showReport() {
      const rows = report.rows.map((r) =>
        `<tr class="${r.status === 'ok' ? '' : 'fallback'}"><td>${r.count}</td><td>${r.key || '(none)'}</td><td>${r.pool}[${r.index ?? '?'}]</td><td>${r.file ?? '-'}</td><td>${r.status}</td></tr>`);
      $('report').innerHTML = `<b>Texture report (${textureSet}): ${report.rows.length} keys, ${report.fallbackCount} fallback</b>` +
        `<table><tr><th>n</th><th>key</th><th>pool</th><th>file</th><th>status</th></tr>${rows.join('')}</table>`;
    }

    function showInfo() {
      const m = report.meta, g = m.generator;
      $('info').textContent = `${m.format} seed ${m.seed} | tiers ${m.tiers} | pitch ${m.levelHeight}" slab ${m.floorThickness}"` +
        (g ? ` | generator ${String(g.rev).slice(0, 8)}${g.dirty ? ' (dirty)' : ''} v${g.version}` : '') +
        ' | textures come from current assets, not those at fixture time';
    }

    function showErrors(errors) {
      $('errors').style.display = errors.length ? 'block' : 'none';
      $('errors').textContent = errors.join('\n');
    }

    function frameModel() {
      const box = new THREE.Box3().setFromObject(model);
      const c = box.getCenter(new THREE.Vector3());
      controls.target.copy(c);
      camera.position.copy(c).add(new THREE.Vector3(1, 1, 1).multiplyScalar(box.getSize(new THREE.Vector3()).length() * 0.8));
      controls.update();
    }

    async function reload() {
      if (model) { scene.remove(model); model = null; }
      report = await (await fetch(textureSet ? `/texture-report.json?textures=${textureSet}` : '/texture-report.json')).json();
      textureSet = report.activeSet || textureSet || 'base';
      const sel = $('texset');
      if (!sel.options.length) {
        for (const s of report.textureSets) sel.add(new Option(s, s));
        sel.addEventListener('change', () => { textureSet = sel.value; reload(); });
      }
      sel.value = textureSet;
      showErrors(report.errors);
      if (!report.ok) { $('info').textContent = 'No valid fixture loaded'; $('report').innerHTML = ''; return; }
      showInfo(); showReport(); buildCuts(report.meta);
      new GLTFLoader().load(`/loaded-model.glb?textures=${textureSet}`, (gltf) => {
        model = gltf.scene;
        scene.add(model);
        frameModel();
        applyHighlight();
      }, undefined, (err) => showErrors([`Error loading model: ${err.message}`]));
    }

    $('hilite').addEventListener('click', () => { highlight = !highlight; applyHighlight(); });
    $('picker').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const res = await (await fetch('/load-map', { method: 'POST', body: await file.text() })).json();
      await reload();
      if (!res.ok) showErrors(res.errors);
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    // WASD fly: W/S forward/back and A/D strafe along the ground, Q/E down/up, Shift = faster.
    // Moves the camera and orbit target together so orbiting still pivots around what you look at.
    const held = new Set();
    const typing = (el) => el && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
    addEventListener('keydown', (e) => { if (!typing(e.target) && !e.ctrlKey && !e.metaKey) held.add(e.code); });
    addEventListener('keyup', (e) => held.delete(e.code));
    addEventListener('blur', () => held.clear());
    renderer.domElement.addEventListener('pointerdown', () => window.focus());
    const fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
    let last = performance.now();
    function fly(dt) {
      const cfg = (report && report.camera) || { moveSpeed: 20, fastMultiplier: 3 };
      const axis = (pos, neg) => (held.has(pos) ? 1 : 0) - (held.has(neg) ? 1 : 0);
      const f = axis('KeyW', 'KeyS'), r = axis('KeyD', 'KeyA'), v = axis('KeyE', 'KeyQ');
      if (!f && !r && !v) return;
      camera.getWorldDirection(fwd); fwd.y = 0;
      if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1); // looking straight down: fall back to a fixed heading
      fwd.normalize();
      right.crossVectors(fwd, up).normalize();
      move.set(0, 0, 0).addScaledVector(fwd, f).addScaledVector(right, r).addScaledVector(up, v);
      move.multiplyScalar(cfg.moveSpeed * (held.has('ShiftLeft') || held.has('ShiftRight') ? cfg.fastMultiplier : 1) * dt);
      camera.position.add(move);
      controls.target.add(move);
    }
    (function animate(now = performance.now()) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - last) / 1000, 0.1); last = now;
      fly(dt);
      controls.update();
      renderer.render(scene, camera);
    })();
    reload();
  </script>
</body>
</html>
